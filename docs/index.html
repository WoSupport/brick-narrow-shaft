<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Breakout — The Narrow Shaft</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #0a0e1a;
    color: #dfe6ff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
  }
  canvas#game {
    background: #0d1224;
    border: 1px solid #2a3352;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(60,90,200,.25);
    display: block;
    max-width: 96vw;
    max-height: 82vh;
    cursor: none;
    image-rendering: auto;
  }
  #hint {
    font-size: 13px; color: #7f8bb8;
    text-align: center; max-width: 620px; line-height: 1.5;
  }
  #hint b { color: #ffd75e; }
  .badge {
    display:inline-block; padding:2px 8px; border-radius:6px;
    font-weight:700; font-size:12px; background:#1a2340;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="560" height="720"></canvas>
  <div id="hint"></div>
</div>

<script>
"use strict";
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hintEl = document.getElementById('hint');
  const W = canvas.width, H = canvas.height;

  // ---------- Fixed layout ----------
  const COLS = 11;
  const BRICK_W = 48, BRICK_H = 20;
  const GRID_X0 = (W - COLS*BRICK_W)/2;      // 16
  const ROW_Y = r => 64 + r*22;               // row 0 top of board
  const PADDLE_Y = H - 46;
  const PADDLE_H = 14;
  const BALL_R = 7;
  const BALL_SPEED = 5.6;

  // ---------- Levels (all share the "narrow shaft through a steel wall" theme) ----------
  // chamber = rows of breakable prize bricks at the top (full width)
  // wall    = rows of steel below the chamber, EXCEPT the given shaft columns which
  //           are breakable all the way through (the only way in)
  const LEVELS = [
    { name:'The Slit',        chamber:3, wall:1, shafts:[[5]], hue:0 },   // one-brick gap, dead center
    { name:'The Crank',       chamber:3, wall:1, shafts:[[7]], hue:1 },   // shifted right
    { name:'Off-Center',      chamber:4, wall:1, shafts:[[4]], hue:3 },   // left, taller chamber
    { name:'The Far Slot',    chamber:3, wall:1, shafts:[[8]], hue:5 },   // far right
    { name:'The Deep Chamber',chamber:5, wall:1, shafts:[[6]], hue:2 },   // tall chamber
  ];
  let cfg = LEVELS[0];
  let autoFloorY = ROW_Y(cfg.chamber);   // top of the steel wall = "auto-play zone" boundary
  let autoMode = true;           // IDLE GAME: an AI paddle plays the whole thing for you
  let autoTimer = 0;             // autopilot phase-timer (seconds)
  let lastBrickBreak = Date.now(); // stall detector for autopilot cascade priming

  // ---------- Input ----------
  let mouseX = W/2;
  let keys = {};
  window.addEventListener('keydown', e => { keys[e.code] = true; });
  window.addEventListener('keyup',   e => { keys[e.code] = false; });
  const toLocalX = e => {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
  };
  const toLocalTouchX = e => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    return (t.clientX - r.left) * (W / r.width);
  };

  // shared "tap / click" action: start, advance level, or launch the serve ball.
  // Called directly from both mouse and touch, so mobile doesn't rely on the
  // click event that preventDefault() on touchstart would otherwise suppress.
  function doTap(){
    if (autoMode) return;            // idle mode: the autopilot owns the phases
    if (state.phase === 'ready'){ startGame(); }
    else if (state.phase === 'won'){ nextLevel(); }
    else if (state.phase === 'over'){ resetAll(); }
    else if (state.phase === 'serve'){
      balls.forEach(b => { if (b.stuck) launchBall(b); });
      state.phase = 'play';
    }
  }

  window.addEventListener('keydown', e => {
    if (autoMode) return;
    if (e.code === 'Space'){
      if (state.phase === 'ready'){ startGame(); }
      else if (state.phase === 'won'){ nextLevel(); }
      else if (state.phase === 'over'){ resetAll(); }
      else if (state.phase === 'serve'){ balls.forEach(b => { if (b.stuck) launchBall(b); }); state.phase='play'; }
    }
  });

  canvas.addEventListener('mousemove', e => { mouseX = toLocalX(e); });
  canvas.addEventListener('mousedown', e => { doTap(); });

  // touch-first controls: finger position drives the paddle, tap fires doTap.
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches[0]) mouseX = toLocalTouchX(e);
    doTap();
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches[0]) mouseX = toLocalTouchX(e);
  }, {passive:false});

  // ---------- Game state ----------
  const state = { phase:'ready', score:0, lives:3, level:1 };
  let bricks = [];
  let balls = [];
  let pickups = [];
  let paddle = { x: W/2, w: 92 };
  let autoPlayStreak = 0;   // consecutive bounces up top
  let ballBelowLong = 0;

  function buildLevel(){
    cfg = LEVELS[(state.level-1) % LEVELS.length];     // cycle levels
    autoFloorY = ROW_Y(cfg.chamber);
    bricks = []; balls = []; pickups = [];
    const wallTop = cfg.chamber;
    const totalRows = wallTop + cfg.wall;
    let breakable = 0, chamber = 0;
    for (let r=0; r<totalRows; r++){
      for (let c=0; c<COLS; c++){
        const x = GRID_X0 + c*BRICK_W;
        const y = ROW_Y(r);
        const isChamber = r < wallTop;                                   // prize bricks up top
        const isShaft   = r >= wallTop &&                               // breakable column(s) THROUGH the steel wall
                          cfg.shafts.some(coll => coll.includes(c));
        const steel = !(isChamber || isShaft);
        const b = {
          x, y, w:BRICK_W, h:BRICK_H,
          c, r,
          steel,
          target: isShaft,       // the narrow breakable section (highlighted)
          alive: true
        };
        if (!steel){ breakable++; if (!isShaft) chamber++; }
        bricks.push(b);
      }
    }
    state.totalBreakable = breakable;
    state.initialBreakable = breakable;
    state.chamberLeft = chamber;       // the level is won by clearing the prize CHAMBER
    resetBall(true);
  }

  function resetBall(serve){
    balls = [];
    serve ? state.phase='serve' : state.phase='serve';
    paddle.x = W/2;
    autoTimer = 0.85;      // autopilot beat before launching
    balls.push({ x: W/2, y: PADDLE_Y - 16, vx:0, vy:0, speed:BALL_SPEED, stuck:true, _js:0 });
  }

  function launchBall(ball){
    ball._js = (Math.random()-0.5)*26;   // slight per-rally aim variation => natural play
    const angle = -Math.PI/2 + (Math.random()*0.5 - 0.25);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.stuck = false;
  }

  // ---------- Collision helpers ----------
  function circleRect(cx, cy, cr, rx, ry, rw, rh){
    const nx = Math.max(rx, Math.min(cx, rx+rw));
    const ny = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx-nx, dy = cy-ny;
    if (dx*dx+dy*dy <= cr*cr) return { nx:nx-cx, ny:ny-cy, hit:true };
    return { hit:false };
  }

  function paddleBounce(ball){
    const p = paddle;
    const rel = (ball.x - p.x) / (p.w/2);       // -1..1
    const clamp = Math.max(-1, Math.min(1, rel));
    const angle = clamp * (Math.PI/3);          // up to 60 deg either way
    ball.speed = Math.min(7.2, ball.speed + 0.08); // gentle ramp
    ball._js = (Math.random()-0.5)*26;          // fresh aim bias each rally (autopilot)
    ball.vx = Math.sin(angle) * ball.speed;
    ball.vy = -Math.cos(angle) * ball.speed;
  }

  function breakBrick(b, byBall){
    if (!b.alive) return;
    b.alive = false;
    state.score += b.target ? 30 : 10;
    // drop pickup
    const p = Math.random();
    if (!b.target && p < 0.10) dropPickup(b, 'E');      // expand
    else if (!b.target && p < 0.30) dropPickup(b, 'S'); // split
    else if (b.target && p < 0.22) dropPickup(b, 'S');  // shaft more likely to drop split
    else if (Math.random() < 0.04) dropPickup(b, 'L');  // extra life
    if (!b.target){ state.chamberLeft--; if (state.chamberLeft <= 0) win(); }
    lastBrickBreak = Date.now();   // for autopilot stall detection
  }

  function dropPickup(b, kind){
    pickups.push({ x: b.x+b.w/2, y: b.y+b.h/2, kind, vy: 1.6 });
  }

  // ---------- Update ----------
  // Autopilot: decides where the paddle should go so the game plays itself.
  // Aims the ball up through the slot to breach the wall, then just tracks
  // the ball to keep it alive and re-feed it through.
  function aiPaddleX(){
    if (!balls.length) return W/2;
    let b = balls[0];
    for (const x of balls) if (x.y > b.y) b = x;        // lowest ball = the one to catch/serve
    if (b.stuck) return b.x;
    if (b._js === undefined) b._js = 0;
    const slitX = GRID_X0 + (cfg.shafts[0][Math.floor(cfg.shafts[0].length/2)] + 0.5)*BRICK_W + b._js;
    const upTop = b.y < autoFloorY || b.vy <= 0;         // ball safe (in the chamber / rising)

    if (upTop){
      // ball is safe up top — chase a falling pickup to feed the multiball cascade
      const value = {S:0, E:1, L:2};
      let pk = null, pkR = Infinity;
      for (const p of pickups){
        if (p.y > PADDLE_Y - 190){
          const r = (value[p.kind] ?? 3) + Math.abs(p.x - paddle.x) * 0.01;
          if (r < pkR){ pk = p; pkR = r; }
        }
      }
      return pk ? pk.x : b.x;
    }

    // ball is coming down in the field — aimed shot up the slot (catches it AND feeds it through)
    const aimShot = b.vy > 0 && b.y > autoFloorY + 4 && b.y < PADDLE_Y - 30;
    if (aimShot){
      const entryY = ROW_Y(cfg.chamber) - 2;
      const dx = Math.max(-320, Math.min(320, slitX - b.x));
      const dy = Math.max(26, b.y - entryY);
      const angle = Math.atan2(dx, dy);
      let rel = angle / (Math.PI/3);
      rel = Math.max(-1, Math.min(1, rel));
      return Math.max(paddle.w/2, Math.min(W - paddle.w/2, b.x - rel*(paddle.w/2)));
    }
    return b.x;
  }

  function update(dt){
    // paddle movement (autopilot drives it in idle mode)
    let target = keys['ArrowLeft']||keys['KeyA'] ? -1 : keys['ArrowRight']||keys['KeyD'] ? 1 : 0;
    if (autoMode){ mouseX = aiPaddleX(); target = 0; }
    if (target !== 0) mouseX = paddle.x + target * 380 * dt;
    const maxX = W - paddle.w/2;
    paddle.x += (mouseX - paddle.x) * Math.min(1, (autoMode?26:12)*dt);
    paddle.x = Math.max(paddle.w/2, Math.min(maxX, paddle.x));

    if (autoMode){
      // autopilot scheduler — advances phases on its own
      autoTimer -= dt;
      if (state.phase === 'ready'){ startGame(); }
      else if (state.phase === 'serve'){
        balls.forEach(b => { if (b.stuck){ b.x = paddle.x; b.y = PADDLE_Y - 16; } });
        if (autoTimer <= 0){ balls.forEach(b => { if (b.stuck) launchBall(b); }); state.phase='play'; }
      }
      else if (state.phase === 'won'){ if (autoTimer <= 0) nextLevel(); }
      else if (state.phase === 'over'){ if (autoTimer <= 0) resetAll(); }

      // stall guard: if no brick has broken in a while, "pump" a split ball in so
      // the multiball cascade always keeps rolling (this is what makes it a good idle show)
      if (state.phase==='play' && balls.length > 0 && balls.length < 8 &&
          Date.now() - lastBrickBreak > 3500){
        // spawn a fresh ball right in the prize chamber so the cascade keeps rolling
        balls.push({ x: GRID_X0 + (2+Math.random()*7)*BRICK_W, y: 50,
                     vx: (Math.random()*6-3), vy: 3, speed:BALL_SPEED, stuck:false, _js:0 });
        lastBrickBreak = Date.now();
      }
    } else {
      // launch stuck ball on serve (Space key)
      if (state.phase === 'serve'){
        balls.forEach(b => { if (b.stuck){ b.x = paddle.x; b.y = PADDLE_Y - 16; } });
        if (keys['Space']){
          balls.forEach(b => { if (b.stuck) launchBall(b); });
          state.phase = 'play';
        }
      }
    }

    // game-world simulation only while actively playing / serving
    if (state.phase==='play' || state.phase==='serve'){

    // pickups
    for (let i=pickups.length-1; i>=0; i--){
      const pk = pickups[i];
      pk.y += pk.vy * dt * 60;
      // catch with paddle
      if (pk.y + 8 >= PADDLE_Y && pk.y - 8 <= PADDLE_Y+PADDLE_H &&
          Math.abs(pk.x - paddle.x) < paddle.w/2 + 8){
        applyPickup(pk.kind);
        pickups.splice(i,1); continue;
      }
      if (pk.y > PADDLE_Y + 40) pickups.splice(i,1);
    }

    // balls
    for (let i=balls.length-1; i>=0; i--){
      const b = balls[i];
      if (b.stuck) continue;

      b.x += b.vx * dt * 60;
      b.y += b.vy * dt * 60;

      // walls
      if (b.x - BALL_R < 0){ b.x = BALL_R; b.vx = Math.abs(b.vx); }
      else if (b.x + BALL_R > W){ b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
      if (b.y - BALL_R < 0){ b.y = BALL_R; b.vy = Math.abs(b.vy); autoPlayStreak++; }

      // paddle
      if (b.vy > 0 && b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + PADDLE_H &&
          b.x >= paddle.x - paddle.w/2 - BALL_R && b.x <= paddle.x + paddle.w/2 + BALL_R){
        b.y = PADDLE_Y - BALL_R;
        paddleBounce(b);
        autoPlayStreak = Math.max(0, autoPlayStreak-1);
      }

      // bottom
      if (b.y - BALL_R > H){
        balls.splice(i,1);
        continue;
      }

      // bricks
      for (const bk of bricks){
        if (!bk.alive) continue;
        const hit = circleRect(b.x, b.y, BALL_R, bk.x, bk.y, bk.w, bk.h);
        if (hit.hit){
          // determine axis
          const dx = b.x - (bk.x + bk.w/2);
          const dy = b.y - (bk.y + bk.h/2);
          if (Math.abs(dx/bk.w) > Math.abs(dy/bk.h)){
            b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
          } else {
            b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
          }
          if (bk.steel){
            state.score += 2;
          } else {
            breakBrick(bk, b);
          }
          // auto-play: bounces confined to chamber
          if (b.y < autoFloorY) autoPlayStreak++; else autoPlayStreak=0;
        }
      }
    }

    // lost all balls
    if (balls.length === 0){
      state.lives--;
      if (state.lives < 0) gameOver();
      else resetBall(false);
    }
    }   // end play/serve gate
  }

  function applyPickup(kind){
    if (kind === 'E') paddle.w = Math.min(150, paddle.w + 34);
    else if (kind === 'L') state.lives++;
    else if (kind === 'S'){
      // split: add up to 2 new balls
      for (let k=0; k<2 && balls.length < 8; k++){
        const src = balls[0] || { x:W/2, y:PADDLE_Y-30, speed:BALL_SPEED };
        let a = Math.random()*Math.PI*2;
        balls.push({ x:src.x, y:src.y-10, vx:Math.cos(a)*BALL_SPEED,
                     vy:-Math.abs(Math.sin(a))*BALL_SPEED, speed:BALL_SPEED, stuck:false });
      }
    }
  }

  // ---------- Win / lose ----------
  function win(){
    state.phase = 'won';
    if (autoMode) autoTimer = 2.4;   // let the "LEVEL CLEARED" card show before advancing
    hintEl.innerHTML = autoMode
      ? '<span class="badge">🏆 LEVEL CLEARED</span> — cascade complete, moving on…'
      : '<span class="badge">🏆 LEVEL CLEARED</span> — the cascade got them all! Press <b>Space</b> or <b>click</b> for the next fortress.';
  }
  function gameOver(){
    state.phase = 'over';
    if (autoMode) autoTimer = 2.6;
    hintEl.innerHTML = autoMode
      ? '<span class="badge">💥 LEVEL LOST</span> — restarting run…'
      : '<span class="badge">💥 GAME OVER</span> — the shaft won this time. Press <b>Space</b> or <b>click</b> to retry.';
  }
  function nextLevel(){
    state.level++;
    buildLevel();          // phase -> serve
    balls.forEach(b => { if (b.stuck) launchBall(b); });
    state.phase = 'play';
  }
  function startGame(){
    state.level = 1; state.score = 0; state.lives = 3;
    buildLevel();
    balls.forEach(b => { if (b.stuck) launchBall(b); });
    state.phase = 'play';
  }
  function resetAll(){ startGame(); }

  // ---------- Render ----------
  function render(){
    ctx.clearRect(0,0,W,H);

    // board backdrop behind chamber
    ctx.fillStyle = '#10162e';

    // bricks
    for (const b of bricks){
      if (!b.alive) continue;
      const g = b.target ? 1 : 0;
      if (b.steel){
        ctx.fillStyle = '#3a425e';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#565e82'; ctx.lineWidth=2; ctx.strokeRect(b.x+1, b.y+1, b.w-2, b.h-2);
        // bolt
        ctx.fillStyle = '#222841';
        ctx.beginPath(); ctx.arc(b.x+b.w/2, b.y+b.h/2, 3, 0, Math.PI*2); ctx.fill();
      } else if (b.target){
        // pulsing highlighted shaft
        const pulse = 0.55 + 0.45*Math.sin(Date.now()/180);
        const base = b.r<=2 ? [120,230,255] : [255,210,100];
        ctx.fillStyle = `rgba(${base[0]},${base[1]},${base[2]},${pulse})`;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#fff'; ctx.lineWidth=1.5;
        ctx.strokeRect(b.x+1.5, b.y+1.5, b.w-3, b.h-3);
      } else {
        const hues = [ [255,90,90],[255,160,60],[255,220,80],[120,255,120],[90,200,255],[170,130,255],[255,110,200] ];
        const col = hues[(b.r + cfg.hue) % hues.length];
        ctx.fillStyle = `rgb(${col[0]+ (b.target?0:0)},${col[1]},${col[2]})`;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#0d1224'; ctx.lineWidth=3;
        ctx.strokeRect(b.x+1.5, b.y+1.5, b.w-3, b.h-3);
      }
    }

    // aim arrow at the shaft(s) — guides the player toward the only entry
    if (state.phase !== 'won' && state.phase !== 'over'){
      // guide arrow near bottom pointing at the first shaft's center column
      const shaftCenterX = GRID_X0 + (cfg.shafts[0][ Math.floor(cfg.shafts[0].length/2) ] + 0.5)*BRICK_W;
      ctx.save();
      ctx.strokeStyle = state.phase==='serve' ? '#ffd75e' : 'rgba(255,215,94,0.7)';
      ctx.fillStyle = ctx.strokeStyle;
      ctx.lineWidth = 3; ctx.lineCap='round';
      const gy = PADDLE_Y - 36;
      ctx.beginPath(); ctx.moveTo(shaftCenterX, gy+14); ctx.lineTo(shaftCenterX, gy);
      ctx.stroke();
      // chevron
      ctx.beginPath();
      ctx.moveTo(shaftCenterX-7, gy+2); ctx.lineTo(shaftCenterX, gy-7); ctx.lineTo(shaftCenterX+7, gy+2);
      ctx.stroke();
      // label
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(cfg.shafts.length>1 ? 'AIM AT A DOOR' : 'AIM HERE', shaftCenterX, gy-12);
      ctx.restore();
    }

    // paddle
    const pg = ctx.createLinearGradient(paddle.x, PADDLE_Y, paddle.x, PADDLE_Y+PADDLE_H);
    pg.addColorStop(0,'#9fb6ff'); pg.addColorStop(1,'#5f7bff');
    ctx.fillStyle = pg;
    roundRect(ctx, paddle.x - paddle.w/2, PADDLE_Y, paddle.w, PADDLE_H, 7);
    ctx.fill();

    // pickups
    for (const pk of pickups){
      ctx.save();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='bold 14px sans-serif';
      const lab = pk.kind==='S' ? '⚡' : pk.kind==='E' ? '◄►' : '♥';
      ctx.fillStyle = pk.kind==='S' ? '#ff5dff' : pk.kind==='E' ? '#5dff9a' : '#ff5d7a';
      ctx.beginPath(); ctx.arc(pk.x, pk.y, 9, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#0d1224'; ctx.fillText(lab, pk.x, pk.y+0.5);
      ctx.restore();
    }

    // balls
    for (const b of balls){
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#8ff';
      ctx.beginPath(); ctx.arc(b.x-2, b.y-2, BALL_R*0.35, 0, Math.PI*2); ctx.fill();
    }

    // HUD
    ctx.fillStyle = '#c7d2ff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textBaseline='top';
    ctx.textAlign='left';
    ctx.fillText('SCORE ' + state.score, 16, 14);
    ctx.textAlign='center';
    ctx.fillText('Level ' + state.level + ' · ' + cfg.name, W/2, 14);
    ctx.textAlign='right';
    ctx.fillText('❤'.repeat(Math.max(0,state.lives)), W-16, 14);

    // auto-play indicator
    const auto = autoPlayStreak >= 6;
    ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.font = auto ? 'bold 15px sans-serif' : '12px sans-serif';
    ctx.fillStyle = auto ? '#5dff9a' : '#56618a';
    ctx.fillText(auto ? '✦ AUTO-PLAY — ball self-sustaining above the wall! ✦'
                      : 'Thread the ball through the glowing shaft', W/2, H-8);

    // serve / phase overlays
    if (state.phase==='serve'){
      ctx.fillStyle='rgba(10,14,26,0.45)';
      ctx.fillRect(0, PADDLE_Y-70, W, 46);
      ctx.fillStyle='#ffd75e'; ctx.font='bold 15px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('TAP / PRESS SPACE to launch the ball', W/2, PADDLE_Y-46);
    } else if (state.phase==='won'){
      ctx.fillStyle='rgba(10,14,26,0.65)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#5dff9a'; ctx.font='bold 34px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🏆 LEVEL CLEARED!', W/2, H/2-24);
      ctx.fillStyle='#c7d2ff'; ctx.font='18px sans-serif';
      ctx.fillText(cfg.name, W/2, H/2+4);
      ctx.fillStyle='#c7d2ff'; ctx.font='16px sans-serif';
      ctx.fillText('Tap / Space for the next fortress — harder shaft incoming', W/2, H/2+30);
    } else if (state.phase==='over'){
      ctx.fillStyle='rgba(10,14,26,0.7)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#ff5d7a'; ctx.font='bold 34px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('GAME OVER', W/2, H/2-20);
      ctx.fillStyle='#c7d2ff'; ctx.font='16px sans-serif';
      ctx.fillText('Click or press Space to retry', W/2, H/2+22);
    } else if (state.phase==='ready'){
      ctx.fillStyle='rgba(10,14,26,0.6)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#9fb6ff'; ctx.font='bold 30px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('THE NARROW SHAFT', W/2, H/2-56);
      ctx.fillStyle='#ffd75e'; ctx.font='bold 20px sans-serif';
      ctx.fillText('Level ' + state.level + ' — ' + cfg.name, W/2, H/2-20);
      ctx.fillStyle='#c7d2ff'; ctx.font='15px sans-serif';
      const lines = [
        'A one-brick-thick steel wall — the only way in is a single glowing slit.',
        cfg.shafts[0].length<3 ? 'The gap is one brick wide: thread the ball dead-center.'
                               : 'The shaft is the only opening — line up and break through.',
        'Once the ball is inside, space opens up and it plays itself.',
        'Catch ⚡ split pickups for chain-reaction multiball clears.',
      ];
      lines.forEach((l,i)=> ctx.fillText(l, W/2, H/2+8 + i*22));
      ctx.fillStyle='#ffd75e'; ctx.font='bold 16px sans-serif';
      ctx.fillText('TAP / PRESS SPACE to begin', W/2, H/2 + 92);
    }
  }

  function roundRect(c,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }

  // ---------- Main loop ----------
  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000);
    last = now;
    update(dt);          // always ran so the autopilot scheduler can advance phases on its own
    render();
    requestAnimationFrame(loop);
  }

  function init(){
    hintEl.innerHTML = autoMode
      ? '🤖 <b>AUTOPILOT</b> — this is an idle game. The paddle plays itself: it threads the glowing slit, ' +
        'then rides the auto-play cascade through every level. Nothing to do but watch. ⚡ split pickups cause multiball chain reactions.'
      : '<b>Aim for the glowing shaft</b> — the only breakable gap in the steel wall. ' +
        'Once the ball gets up top it self-sustains (auto-play). Grab <span class="badge" style="color:#ff5dff">⚡ split</span> ' +
        'pickups for multiball chain reactions. Mouse / Arrow keys / touch to move.';
    buildLevel();
    state.phase = 'ready';
    requestAnimationFrame(loop);
  }

  init();

  // debug/test hook (inert in normal play)
  window.__game = () => ({
    phase: state.phase, score: state.score, lives: state.lives, level: state.level,
    name: cfg.name, shafts: JSON.stringify(cfg.shafts),
    balls: balls.map(b=>({x:Math.round(b.x*10)/10, y:Math.round(b.y*10)/10, stuck:b.stuck})),
    bricksLeft: bricks.filter(b=>b.alive && !b.steel).length,
    chamberLeft: state.chamberLeft,
    bricksTotal: state.initialBreakable,
    autoStreak: autoPlayStreak,
    pickups: pickups.length
  });
  window.__debug = {
    // teleport a ball up inside the chamber with an upward velocity to observe
    // the auto-play / cascade / win path (verification only, not reachable in play)
    putBallInChamber: function(){
      balls = [ { x: W/2, y: 50, vx: 2.8, vy: 3.2, speed:BALL_SPEED, stuck:false } ];
      autoPlayStreak = 999;
      state.lives = 9;      // test scaffolding: keep the feed alive long enough to clear
      state.phase = 'play';
    },
    // test scaffolding: jump straight to the next level config without clearing
    goNext: function(){ state.level++; buildLevel(); },
    goReset: function(){ startGame(); }
  };
})();
</script>
